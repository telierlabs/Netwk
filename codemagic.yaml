workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 22
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Create dummy dist folder
        script: mkdir -p dist && echo '<html></html>' > dist/index.html
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
