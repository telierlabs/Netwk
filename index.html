<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="ed0VUWvVgZMd0gbev3KZTezJDQFsNeBstgA1tGtJnZo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>Cylen</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" href="/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" href="/android-chrome-512x512.png" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f1f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131314" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="description" content="Cylen adalah asisten AI futuristik yang membantu Anda mencari informasi, mengedit gambar, dan berdiskusi dengan cerdas. Cepat, aman, dan personal." />
    <meta name="keywords" content="AI, asisten AI, Cylen, chatbot, edit gambar AI, pencarian web AI" />
    <meta name="author" content="Cylen Team" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cylen",
      "url": "https://cylenai.com/"
    }
    </script>

    <!-- ── PASANG TEMA SEBELUM LAYAR PERTAMA DIGAMBAR ──
         Membaca pilihan tema yang tersimpan (localStorage 'cylen_theme', ditulis oleh App.tsx / halaman Appearance),
         lalu memasang palet yang SAMA dengan App.tsx. Jadi kalau kamu memilih Dark, dari loading
         sampai antarmuka chat sudah gelap, tidak ada kedip putih atau palet lama.
         Palet di sini harus sama dengan THEME_VARS di src/App.tsx. -->
    <script>
      (function() {
        var P = {
          't-light':  { '--bg':'#f1f1f1', '--sf':'#ffffff', '--bd':'rgba(0,0,0,.07)', '--text':'#161616', '--mu':'rgba(0,0,0,.45)', '--cd':'#f7f7f7', '--ac':'#141414', '--at':'#f5f5f5', '--ib':'#ececec' },
          't-dark':   { '--bg':'#131314', '--sf':'#1e1f20', '--bd':'rgba(255,255,255,.07)', '--text':'#e3e3e3', '--mu':'rgba(255,255,255,.5)', '--cd':'#242526', '--ac':'#e3e3e3', '--at':'#131314', '--ib':'#2a2b2d' },
          't-foryou': { '--bg':'#f4f3ee', '--sf':'#faf9f6', '--bd':'rgba(38,37,34,.09)', '--text':'#2a2926', '--mu':'rgba(42,41,38,.55)', '--cd':'#ebe9e1', '--ac':'#2a2926', '--at':'#f4f3ee', '--ib':'#e9e7df' }
        };
        // Rumus sama dengan isMobileDevice() di App.tsx / main.tsx
        var isMobile = [
          window.matchMedia('(pointer: coarse)').matches,
          window.matchMedia('(max-width: 768px)').matches,
          /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
        ].filter(Boolean).length >= 2;
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        var id = null;
        try { id = localStorage.getItem('cylen_theme'); } catch (e) {}
        if (id === 'system') id = systemDark ? 't-dark' : 't-light';
        if (!id || !P[id]) id = (isMobile && systemDark) ? 't-dark' : 't-light';

        var v = P[id];
        var root = document.documentElement;
        for (var k in v) root.style.setProperty(k, v[k]);
        root.style.colorScheme = id === 't-dark' ? 'dark' : 'light';
        root.style.backgroundColor = v['--bg'];
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach(function(m) { m.setAttribute('content', v['--bg']); });
      })();
    </script>

    <style>
      /* Cadangan kalau script di atas gagal jalan (palet sama dengan App.tsx) */
      :root {
        --bg: #f1f1f1; --sf: #ffffff; --bd: rgba(0,0,0,.07); --text: #161616; --mu: rgba(0,0,0,.45); --cd: #f7f7f7; --ac: #141414; --at: #f5f5f5; --ib: #ececec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131314; --sf: #1e1f20; --bd: rgba(255,255,255,.07); --text: #e3e3e3; --mu: rgba(255,255,255,.5); --cd: #242526; --ac: #e3e3e3; --at: #131314; --ib: #2a2b2d;
        }
      }

      * { -webkit-tap-highlight-color: transparent !important; }
      *:focus, *:focus-visible, *:active { outline: none !important; box-shadow: none !important; }
      input:not([type="file"]), textarea, button, select { outline: none !important; -webkit-appearance: none !important; border-color: transparent; }
      textarea { border: none !important; }

      /* reset default border/shadow bawaan browser di elemen header/nav manapun */
      header, nav, footer {
        border: none !important;
        box-shadow: none !important;
        -webkit-box-shadow: none !important;
      }

      html {
        background-color: var(--bg) !important;
      }

      html, body {
        overscroll-behavior-y: none !important;
        overscroll-behavior-x: none !important;
        position: fixed;
        outline: none !important;
        background-color: var(--bg) !important;
        color: var(--text);
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
        background-color: var(--bg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ── PENJAGA ERROR ──
         - Pengguna biasa TIDAK melihat layar error mentah.
         - Mode debug khusus developer: buka  cylenai.com/?debug=1  sekali
           (tetap aktif sampai  cylenai.com/?debug=0 ). Di mode ini layar
           error mentah muncul seperti dulu.
         - Kalau file app gagal dimuat (sinyal putus / versi lama), pengguna
           melihat layar ramah dengan tombol "Muat ulang", bukan layar kosong. -->
    <script>
      (function () {
        var debug = false;
        try {
          var p = new URLSearchParams(location.search).get('debug');
          if (p === '1') localStorage.setItem('cylen_debug', '1');
          if (p === '0') localStorage.removeItem('cylen_debug');
          debug = localStorage.getItem('cylen_debug') === '1';
        } catch (e) {}

        // ── Layar error mentah: HANYA di mode debug ──
        if (debug) {
          var overlay = document.createElement('div');
          overlay.id = 'cylen-error-overlay';
          overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:999999;background:#1a0000;color:#ff6b6b;font-family:monospace;font-size:12px;padding:16px;overflow:auto;white-space:pre-wrap;';
          document.body.appendChild(overlay);
          var showError = function (title, detail) {
            overlay.style.display = 'block';
            overlay.textContent += '\n\n=== ' + title + ' ===\n' + detail;
          };
          window.addEventListener('error', function (e) {
            if (!(e instanceof ErrorEvent)) return;
            showError('Script Error', (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
          });
          window.addEventListener('unhandledrejection', function (e) {
            showError('Unhandled Promise Rejection', e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
          });
        }

        // ── Layar ramah kalau app gagal dimuat ──
        var showFriendly = function () {
          if (document.getElementById('cylen-fallback')) return;
          var d = document.createElement('div');
          d.id = 'cylen-fallback';
          d.style.cssText = 'position:fixed;inset:0;z-index:999998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;';
          d.innerHTML =
            '<div style="font-size:20px;font-weight:700">Ups, ada kendala</div>' +
            '<div style="font-size:14px;opacity:.65;max-width:300px;line-height:1.5">Aplikasi gagal dimuat. Cek koneksi internet kamu lalu coba lagi.</div>' +
            '<button id="cylen-reload" style="background:var(--ac);color:var(--at);border:none;border-radius:14px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer">Muat ulang</button>';
          document.body.appendChild(d);
          var b = document.getElementById('cylen-reload');
          if (b) b.onclick = function () { location.reload(); };
        };

        // File skrip app gagal diunduh
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && t.tagName === 'SCRIPT') showFriendly();
        }, true);

        // App belum tampil sama sekali setelah 15 detik
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && r.childElementCount === 0) showFriendly();
        }, 15000);

        // Begitu app berhasil tampil, layar ramah otomatis hilang
        var root = document.getElementById('root');
        if (root && window.MutationObserver) {
          new MutationObserver(function () {
            if (root.childElementCount > 0) {
              var f = document.getElementById('cylen-fallback');
              if (f) f.remove();
            }
          }).observe(root, { childList: true });
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.error('SW Error!', err));
        });
      }
    </script>
  </body>
</html>
