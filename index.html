<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>Cylen</title>
    
    <link rel="icon" type="image/png" href="/Icon-192.png" />
    <link rel="apple-touch-icon" href="/Icon-192.png" />
    
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#010101" />
    
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <meta name="description" content="Cylen adalah asisten AI futuristik yang membantu Anda mencari informasi, mengedit gambar, dan berdiskusi dengan cerdas. Cepat, aman, dan personal." />
    <meta name="keywords" content="AI, asisten AI, Cylen, chatbot, edit gambar AI, pencarian web AI" />
    <meta name="author" content="Cylen Team" />
    
    <style>
      :root {
        --bg: #ffffff; --sf: #f5f5f5; --bd: rgba(0,0,0,0.08); --text: #0a0a0a; --mu: rgba(0,0,0,0.38); --cd: #ffffff; --ac: #0a0a0a; --at: #ffffff; --ib: #f0f0f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #010101; --sf: #161616; --bd: rgba(255,255,255,0.07); --text: #f0f0f0; --mu: rgba(255,255,255,0.35); --cd: #111111; --ac: #ffffff; --at: #010101; --ib: #222222;
        }
      }

      * { -webkit-tap-highlight-color: transparent !important; }
      *:focus, *:focus-visible, *:active { outline: none !important; box-shadow: none !important; }
      input:not([type="file"]), textarea, button, select { outline: none !important; -webkit-appearance: none !important; border-color: transparent; }
      textarea { border: none !important; }

      html, body {
        overscroll-behavior-y: none !important;
        overscroll-behavior-x: none !important;
        position: fixed;
        outline: none !important;
        background-color: var(--bg) !important;
        color: var(--text);
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        /* HAPUS padding-top safe area dari sini — biar header yang handle */
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
        background-color: var(--bg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
