<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="ed0VUWvVgZMd0gbev3KZTezJDQFsNeBstgA1tGtJnZo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>Cylen</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" href="/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" href="/android-chrome-512x512.png" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="description" content="Cylen adalah asisten AI futuristik yang membantu Anda mencari informasi, mengedit gambar, dan berdiskusi dengan cerdas. Cepat, aman, dan personal." />
    <meta name="keywords" content="AI, asisten AI, Cylen, chatbot, edit gambar AI, pencarian web AI" />
    <meta name="author" content="Cylen Team" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cylen",
      "url": "https://cylenai.com/"
    }
    </script>

    <script>
      (function() {
        var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var bg = isDark ? '#000000' : '#ffffff';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach(function(m) { m.setAttribute('content', bg); });
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.setProperty('--bg', bg);
      })();
    </script>

    <style>
      :root {
        --bg: #ffffff; --sf: #f5f5f5; --bd: rgba(0,0,0,0.08); --text: #0a0a0a; --mu: rgba(0,0,0,0.38); --cd: #ffffff; --ac: #0a0a0a; --at: #ffffff; --ib: #f0f0f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000; --sf: #1c1c1c; --bd: rgba(255,255,255,0.07); --text: #ffffff; --mu: rgba(255,255,255,0.35); --cd: #171717; --ac: #ffffff; --at: #000000; --ib: #252525;
        }
      }

      * { -webkit-tap-highlight-color: transparent !important; }
      *:focus, *:focus-visible, *:active { outline: none !important; box-shadow: none !important; }
      input:not([type="file"]), textarea, button, select { outline: none !important; -webkit-appearance: none !important; border-color: transparent; }
      textarea { border: none !important; }

      /* reset default border/shadow bawaan browser di elemen header/nav manapun */
      header, nav, footer {
        border: none !important;
        box-shadow: none !important;
        -webkit-box-shadow: none !important;
      }

      html {
        background-color: var(--bg) !important;
      }

      html, body {
        overscroll-behavior-y: none !important;
        overscroll-behavior-x: none !important;
        position: fixed;
        outline: none !important;
        background-color: var(--bg) !important;
        color: var(--text);
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
        background-color: var(--bg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ── PENJAGA ERROR ──
         - Pengguna biasa TIDAK melihat layar error mentah.
         - Mode debug khusus developer: buka  cylenai.com/?debug=1  sekali
           (tetap aktif sampai  cylenai.com/?debug=0 ). Di mode ini layar
           error mentah muncul seperti dulu.
         - Kalau file app gagal dimuat (sinyal putus / versi lama), pengguna
           melihat layar ramah dengan tombol "Muat ulang", bukan layar kosong. -->
    <script>
      (function () {
        var debug = false;
        try {
          var p = new URLSearchParams(location.search).get('debug');
          if (p === '1') localStorage.setItem('cylen_debug', '1');
          if (p === '0') localStorage.removeItem('cylen_debug');
          debug = localStorage.getItem('cylen_debug') === '1';
        } catch (e) {}

        // ── Layar error mentah: HANYA di mode debug ──
        if (debug) {
          var overlay = document.createElement('div');
          overlay.id = 'cylen-error-overlay';
          overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:999999;background:#1a0000;color:#ff6b6b;font-family:monospace;font-size:12px;padding:16px;overflow:auto;white-space:pre-wrap;';
          document.body.appendChild(overlay);
          var showError = function (title, detail) {
            overlay.style.display = 'block';
            overlay.textContent += '\n\n=== ' + title + ' ===\n' + detail;
          };
          window.addEventListener('error', function (e) {
            if (!(e instanceof ErrorEvent)) return;
            showError('Script Error', (e.message || '') + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
          });
          window.addEventListener('unhandledrejection', function (e) {
            showError('Unhandled Promise Rejection', e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
          });
        }

        // ── Layar ramah kalau app gagal dimuat ──
        var showFriendly = function () {
          if (document.getElementById('cylen-fallback')) return;
          var d = document.createElement('div');
          d.id = 'cylen-fallback';
          d.style.cssText = 'position:fixed;inset:0;z-index:999998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;';
          d.innerHTML =
            '<div style="font-size:20px;font-weight:700">Ups, ada kendala</div>' +
            '<div style="font-size:14px;opacity:.65;max-width:300px;line-height:1.5">Aplikasi gagal dimuat. Cek koneksi internet kamu lalu coba lagi.</div>' +
            '<button id="cylen-reload" style="background:var(--ac);color:var(--at);border:none;border-radius:14px;padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer">Muat ulang</button>';
          document.body.appendChild(d);
          var b = document.getElementById('cylen-reload');
          if (b) b.onclick = function () { location.reload(); };
        };

        // File skrip app gagal diunduh
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && t.tagName === 'SCRIPT') showFriendly();
        }, true);

        // App belum tampil sama sekali setelah 15 detik
        setTimeout(function () {
          var r = document.getElementById('root');
          if (r && r.childElementCount === 0) showFriendly();
        }, 15000);

        // Begitu app berhasil tampil, layar ramah otomatis hilang
        var root = document.getElementById('root');
        if (root && window.MutationObserver) {
          new MutationObserver(function () {
            if (root.childElementCount > 0) {
              var f = document.getElementById('cylen-fallback');
              if (f) f.remove();
            }
          }).observe(root, { childList: true });
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.error('SW Error!', err));
        });
      }
    </script>
  </body>
</html>
