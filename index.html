<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="ed0VUWvVgZMd0gbev3KZTezJDQFsNeBstgA1tGtJnZo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>Cylen</title>

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" href="/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" href="/android-chrome-512x512.png" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="description" content="Cylen adalah asisten AI futuristik yang membantu Anda mencari informasi, mengedit gambar, dan berdiskusi dengan cerdas. Cepat, aman, dan personal." />
    <meta name="keywords" content="AI, asisten AI, Cylen, chatbot, edit gambar AI, pencarian web AI" />
    <meta name="author" content="Cylen Team" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cylen",
      "url": "https://cylenai.com/"
    }
    </script>

    <script>
      (function() {
        var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var bg = isDark ? '#000000' : '#ffffff';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        metas.forEach(function(m) { m.setAttribute('content', bg); });
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.setProperty('--bg', bg);
      })();
    </script>

    <style>
      :root {
        --bg: #ffffff; --sf: #f5f5f5; --bd: rgba(0,0,0,0.08); --text: #0a0a0a; --mu: rgba(0,0,0,0.38); --cd: #ffffff; --ac: #0a0a0a; --at: #ffffff; --ib: #f0f0f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000; --sf: #1c1c1c; --bd: rgba(255,255,255,0.07); --text: #ffffff; --mu: rgba(255,255,255,0.35); --cd: #171717; --ac: #ffffff; --at: #000000; --ib: #252525;
        }
      }

      * { -webkit-tap-highlight-color: transparent !important; }
      *:focus, *:focus-visible, *:active { outline: none !important; box-shadow: none !important; }
      input:not([type="file"]), textarea, button, select { outline: none !important; -webkit-appearance: none !important; border-color: transparent; }
      textarea { border: none !important; }

      /* reset default border/shadow bawaan browser di elemen header/nav manapun */
      header, nav, footer {
        border: none !important;
        box-shadow: none !important;
        -webkit-box-shadow: none !important;
      }

      html {
        background-color: var(--bg) !important;
      }

      html, body {
        overscroll-behavior-y: none !important;
        overscroll-behavior-x: none !important;
        position: fixed;
        outline: none !important;
        background-color: var(--bg) !important;
        color: var(--text);
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
        background-color: var(--bg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW Registered!', reg))
            .catch(err => console.error('SW Error!', err));
        });
      }
    </script>
  </body>
</html>
